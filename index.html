<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEI Gestão - Login</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .login-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Left Panel - Promotional */
        .login-left {
            width: 50%;
            background-color: #2563eb;
            color: white;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .login-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .login-logo-icon {
            width: 48px;
            height: 48px;
            background-color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-logo-text {
            font-size: 32px;
            font-weight: bold;
        }

        .login-tagline {
            font-size: 20px;
            margin-bottom: 48px;
            opacity: 0.95;
        }

        .login-features {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .login-feature {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .login-feature-icon {
            width: 24px;
            height: 24px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .login-feature-text {
            font-size: 16px;
        }

        /* Right Panel - Login Form */
        .login-right {
            width: 50%;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .login-form-container {
            width: 100%;
            max-width: 400px;
        }

        .login-welcome {
            margin-bottom: 8px;
        }

        .login-welcome h1 {
            font-size: 32px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .login-welcome p {
            font-size: 16px;
            color: #6b7280;
            margin-bottom: 32px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .login-form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .login-form-group label {
            font-size: 14px;
            font-weight: 600;
            color: #1f2937;
        }

        .login-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .login-input-icon {
            position: absolute;
            left: 16px;
            color: #6b7280;
            pointer-events: none;
        }

        .login-input {
            width: 100%;
            padding: 12px 16px 12px 48px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .login-input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .login-input-password {
            padding-right: 48px;
        }

        .login-password-toggle {
            position: absolute;
            right: 16px;
            cursor: pointer;
            color: #6b7280;
            transition: color 0.2s;
        }

        .login-password-toggle:hover {
            color: #2563eb;
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: -8px;
        }

        .login-remember {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .login-remember input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .login-remember label {
            font-size: 14px;
            color: #1f2937;
            cursor: pointer;
        }

        .login-forgot {
            font-size: 14px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .login-forgot:hover {
            color: #1e40af;
        }

        .login-btn {
            width: 100%;
            padding: 14px 24px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .login-btn:hover {
            background-color: #1e40af;
        }

        .login-signup {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #6b7280;
        }

        .login-signup a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .login-signup a:hover {
            color: #1e40af;
        }

        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
            }

            .login-left {
                width: 100%;
                padding: 40px;
            }

            .login-right {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Left Panel -->
        <div class="login-left">
            <div class="login-logo">
                <div class="login-logo-icon">
                    <svg width="24" height="24" fill="#2563eb" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M3 3a1 1 0 000 2v8a2 2 0 002 2h2.586l-1.293 1.293a1 1 0 101.414 1.414L10 15.414l2.293 2.293a1 1 0 001.414-1.414L12.414 15H15a2 2 0 002-2V5a1 1 0 100-2H3zm11.707 4.707a1 1 0 00-1.414-1.414L10 9.586 8.707 8.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <div class="login-logo-text">MEI Gestão</div>
            </div>
            <p class="login-tagline">Gerencie suas finanças com inteligência e simplicidade</p>
            <div class="login-features">
                <div class="login-feature">
                    <div class="login-feature-icon">
                        <svg width="16" height="16" fill="#2563eb" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                        </svg>
                    </div>
                    <div class="login-feature-text">Controle total de receitas e despesas</div>
                </div>
                <div class="login-feature">
                    <div class="login-feature-icon">
                        <svg width="16" height="16" fill="#2563eb" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                        </svg>
                    </div>
                    <div class="login-feature-text">Relatórios detalhados e insights</div>
                </div>
                <div class="login-feature">
                    <div class="login-feature-icon">
                        <svg width="16" height="16" fill="#2563eb" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                        </svg>
                    </div>
                    <div class="login-feature-text">Gestão simplificada para MEI</div>
                </div>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="login-right">
            <div class="login-form-container">
                <div class="login-welcome">
                    <h1>Bem-vindo de volta!</h1>
                    <p>Entre com suas credenciais para acessar sua conta</p>
                </div>
                <form class="login-form" id="loginForm">
                    <div class="login-form-group">
                        <label for="loginEmail">E-mail</label>
                        <div class="login-input-wrapper">
                            <svg class="login-input-icon" width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
                                <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
                            </svg>
                            <input type="email" id="loginEmail" class="login-input" placeholder="seu@email.com" required>
                        </div>
                    </div>
                    <div class="login-form-group">
                        <label for="loginPassword">Senha</label>
                        <div class="login-input-wrapper">
                            <svg class="login-input-icon" width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
                            </svg>
                            <input type="password" id="loginPassword" class="login-input login-input-password" placeholder="••••••••" required>
                            <svg class="login-password-toggle" id="togglePassword" width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                                <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
                            </svg>
                        </div>
                    </div>
                    <div class="login-options">
                        <div class="login-remember">
                            <input type="checkbox" id="rememberMe" name="remember">
                            <label for="rememberMe">Lembrar-me</label>
                        </div>
                        <a href="recuperar-senha.html" class="login-forgot">Esqueceu a senha?</a>
                    </div>
                    <button type="submit" class="login-btn">
                        Entrar
                        <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
                        </svg>
                    </button>
                </form>
                <div class="login-signup">
                    Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Toggle password visibility
        const togglePassword = document.getElementById('togglePassword');
        const loginPassword = document.getElementById('loginPassword');
        const loginForm = document.getElementById('loginForm');

        togglePassword.addEventListener('click', () => {
            const type = loginPassword.getAttribute('type') === 'password' ? 'text' : 'password';
            loginPassword.setAttribute('type', type);
            
            // Toggle icon
            if (type === 'text') {
                togglePassword.innerHTML = `
                    <path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.906 1.255l-1.387-1.387zm5.196 5.196L10 9.586V7a3 3 0 00-3 3v.586l1.903 1.903zM8 12a4 4 0 014-4v.586l-4 4V12z" clip-rule="evenodd"/>
                    <path d="M5 12a5 5 0 017.446-4.446l-7.892 7.892A4.998 4.998 0 015 12z"/>
                `;
            } else {
                togglePassword.innerHTML = `
                    <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                    <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
                `;
            }
        });

        // Form submit
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            // Redirecionar para o dashboard após login
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
